<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid quantum systems</title>
  <desc id="desc">A central hybrid interface connects superconducting circuits, mechanical systems, and spins.</desc>
  <rect width="800" height="520" fill="#f6f8f9"/>
  <g fill="none" stroke="#b8c9d2" stroke-width="3">
    <path d="M400 260 L400 110"/>
    <path d="M400 260 L230 390"/>
    <path d="M400 260 L570 390"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <circle cx="400" cy="260" r="88" fill="#126b96"/>
    <text x="400" y="250" fill="#fff" font-size="28" font-weight="600">Hybrid</text>
    <text x="400" y="286" fill="#fff" font-size="28" font-weight="600">interface</text>
    <g fill="#eef4f7" stroke="#9fb9c7" stroke-width="2">
      <circle cx="400" cy="90" r="70"/>
      <circle cx="205" cy="410" r="70"/>
      <circle cx="595" cy="410" r="70"/>
    </g>
    <g fill="#315c72" font-size="23" font-weight="500">
      <text x="400" y="83">Circuits</text>
      <text x="400" y="111">Microwaves</text>
      <text x="205" y="403">Mechanical</text>
      <text x="205" y="431">systems</text>
      <text x="595" y="403">Spins</text>
      <text x="595" y="431">Defects</text>
    </g>
  </g>
</svg>
