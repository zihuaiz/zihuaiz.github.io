short_bio: >-
  <p>
    I am an incoming Assistant Professor in the Department of Physics at Colorado School of Mines, starting in Fall 2026. Our group explores solid-state and hybrid quantum systems for quantum sensing, information processing, and quantum-enabled technologies. We combine superconducting circuits, nanomechanical devices, and quantum defects to develop new platforms for quantum control, quantum transduction, and engineered quantum matter, with an emphasis on understanding and mitigating the microscopic mechanisms that limit coherence. 
  </p>
  <p>
  Our work is inherently interdisciplinary and spans quantum device engineering, nanofabrication, superconducting electronics, spin physics, microwave and mechanical control, materials characterization, and cryogenic measurement.
  </p>
  <p>
    If you are excited about these research directions and interested in joining our group, I would be happy to hear from you. Please feel free to reach out by email.
  </p>

