short_bio: >-
  <p>
    I am an Assistant Professor in the
    <a href="https://physics.mines.edu/" target="_blank">Department of Physics</a>
    at
    <a href="https://www.mines.edu/" target="_blank">Colorado School of Mines</a>. Our group explores solid-state quantum systems for sensing, information processing, and quantum-enabled technologies. We combine superconducting circuits, nanomechanical devices, and quantum defects to develop new platforms for coherent control, transduction, and engineered quantum matter, with an emphasis on understanding and mitigating the microscopic mechanisms that limit coherence.
  </p>

  <p>
    Our work is inherently interdisciplinary and combines quantum device engineering, superconducting and spin-based systems, nanofabrication, microwave and electromechanical control, materials characterization, and low-temperature measurement. We are especially excited by ideas that bridge physics, engineering, and materials science.
  </p>

