short_bio: >-
  <p>
    I am an incoming Assistant Professor in the Department of Physics at Colorado School of Mines, starting in Fall 2026. Our group explores hybrid quantum systems that combine superconducting circuits, nanomechanical devices, and quantum defects to develop new platforms for coherent control, quantum transduction, and quantum-enabled technologies.
  </p>
  <p>
    If you are excited about these research directions and interested in joining our group, I would be glad to hear from you. Please feel free to reach out by email.
  </p>

