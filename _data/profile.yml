short_bio: >-
  <p>
    I am an incoming Assistant Professor in the Department of Physics at Colorado School of Mines, starting in Fall 2026. Our group explores solid-state quantum systems for sensing, information processing, and quantum-enabled technologies. We combine superconducting circuits, nanomechanical devices, and quantum defects to develop new platforms for coherent control, transduction, and engineered quantum matter, with an emphasis on understanding and mitigating the microscopic mechanisms that limit coherence. 
  </p>
  <p>
    Our work is inherently interdisciplinary and spans quantum device engineering, nanofabrication, superconducting electronics, spin physics, microwave and mechanical control, materials characterization, and cryogenic measurement. We are especially excited by ideas that connect different areas of quantum science, engineering, and materials physics.
  </p>
  <p>
    We are actively recruiting PhD students starting in Spring and Fall 2027. Students with backgrounds in physics, electrical engineering, materials science, nanotechnology, or related areas are encouraged to reach out. If you are interested in joining the group or discussing potential research directions, I would be happy to hear from you.
  </p>

